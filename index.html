<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Что бьёт камень? | Нейросеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #0f3460;
            border-radius: 20px;
            padding: 24px;
        }
        h1 { text-align: center; color: #e94560; margin-bottom: 20px; }
        .chat {
            background: #1a1a2e;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        .message { margin-bottom: 12px; display: flex; }
        .bot { justify-content: flex-start; }
        .user { justify-content: flex-end; }
        .bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            background: #e94560;
            color: white;
        }
        .bot .bubble { background: #1a1a2e; border: 1px solid #e94560; }
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #1a1a2e;
            color: white;
        }
        button {
            padding: 12px 24px;
            background: #e94560;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
        }
        .reason { font-size: 12px; opacity: 0.7; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h1>❓ Что бьёт камень?</h1>
    <div class="chat" id="chat">
        <div class="message bot"><div class="bubble">🔮 Что бьёт "камень"?</div></div>
    </div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Ваш ответ...">
        <button onclick="send()">→</button>
    </div>
</div>

<script>
    let currentSubject = "камень";
    let isLoading = false;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function addMessage(type, text, reason = null) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        let html = `<div class="bubble">${text}`;
        if (reason) html += `<div class="reason">🧠 ${reason}</div>`;
        html += `</div>`;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
        if (isLoading) return;
        const answer = input.value.trim().toLowerCase();
        if (!answer) return;
        
        addMessage('user', answer);
        input.value = '';
        isLoading = true;
        
        // Имитация работы нейросети (без API — локальная логика)
        setTimeout(() => {
            const knownFacts = {
                'вода,камень': true, 'бумага,камень': true, 'время,камень': true,
                'камень,ножницы': true, 'ножницы,бумага': true, 'мороз,вода': true,
                'огонь,вода': false, 'россия,камень': false, 'санкции,россия': true
            };
            const key = `${answer},${currentSubject}`;
            let beats = knownFacts[key];
            let reason = '';
            
            if (beats === undefined) {
                beats = Math.random() > 0.5;
                reason = beats ? 'Похоже на правду' : 'Сомнительное утверждение';
            } else {
                reason = beats ? 'Подтверждено базой знаний' : 'Противоречит логике';
            }
            
            if (beats) {
                addMessage('bot', `✅ ДА! ${answer} БЬЁТ ${currentSubject}`, reason);
                currentSubject = answer;
                setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
            } else {
                addMessage('bot', `❌ НЕТ, ${answer} НЕ БЬЁТ ${currentSubject}`, reason);
                setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
            }
            isLoading = false;
        }, 500);
    }
    
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
