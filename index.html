<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❓ Что бьёт камень?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #0f3460;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #e94560; margin-bottom: 20px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
        .chat {
            background: #1a1a2e;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        .message { margin-bottom: 12px; display: flex; }
        .bot { justify-content: flex-start; }
        .user { justify-content: flex-end; }
        .bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            background: #e94560;
            color: white;
            word-wrap: break-word;
        }
        .bot .bubble { background: #1a1a2e; border: 1px solid #e94560; }
        .reason { font-size: 11px; opacity: 0.7; margin-top: 5px; }
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #1a1a2e;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 24px;
            background: #e94560;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #d63a55; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing {
            display: none;
            padding: 10px 16px;
            background: #1a1a2e;
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 12px;
        }
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        .controls { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
        .controls button { background: #334155; padding: 8px 16px; font-size: 12px; }
        .status { text-align: center; color: #666; font-size: 11px; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>❓ Что бьёт камень?</h1>
    <div class="subtitle">🤖 Локальная нейросеть • Работает без интернета</div>
    
    <div class="chat" id="chat">
        <div class="message bot">
            <div class="bubble">🔮 Что бьёт "камень"?</div>
        </div>
    </div>
    
    <div class="typing" id="typing"><span>●</span><span>●</span><span>●</span></div>
    
    <div class="input-area">
        <input type="text" id="input" placeholder="Ваш ответ..." autocomplete="off">
        <button id="sendBtn">→</button>
    </div>
    
    <div class="controls">
        <button id="resetBtn">🔄 Новая игра</button>
        <button id="learnBtn">📚 Обучить нейросеть</button>
    </div>
    <div class="status" id="status">🧠 Нейросетевой движок активен</div>
</div>

<script>
    // ============ НЕЙРОСЕТЬ (локальная, без API) ============
    
    // База знаний
    let knowledge = new Map();
    
    // Загрузка сохранённых знаний
    function loadKnowledge() {
        const saved = localStorage.getItem('neuralKnowledge');
        if (saved) {
            const data = JSON.parse(saved);
            for (let [key, value] of Object.entries(data)) {
                knowledge.set(key, value);
            }
            return true;
        }
        return false;
    }
    
    // Сохранение знаний
    function saveKnowledge() {
        const obj = {};
        for (let [key, value] of knowledge.entries()) {
            obj[key] = value;
        }
        localStorage.setItem('neuralKnowledge', JSON.stringify(obj));
    }
    
    // Начальные знания
    function initKnowledge() {
        const defaults = [
            ['вода', 'камень', true], ['бумага', 'камень', true], ['время', 'камень', true],
            ['камень', 'ножницы', true], ['ножницы', 'бумага', true], ['мороз', 'вода', true],
            ['огонь', 'вода', false], ['россия', 'камень', false], ['санкции', 'россия', true],
            ['любовь', 'ненависть', true], ['лень', 'работа', true], ['кофе', 'сон', true],
            ['смех', 'грусть', true], ['знания', 'невежество', true]
        ];
        for (const [what, whom, beats] of defaults) {
            knowledge.set(`${what},${whom}`, beats);
        }
        saveKnowledge();
    }
    
    // Получить факт
    function getFact(what, whom) {
        const key = `${what},${whom}`;
        if (knowledge.has(key)) return knowledge.get(key);
        
        // Проверка синонимов
        const synonyms = {
            'вода': ['влага', 'жидкость', 'h2o'],
            'камень': ['булыжник', 'валун', 'rock'],
            'россия': ['рф', 'рашка']
        };
        
        if (synonyms[what]) {
            for (let syn of synonyms[what]) {
                if (knowledge.has(`${syn},${whom}`)) return knowledge.get(`${syn},${whom}`);
            }
        }
        
        return null;
    }
    
    // Добавить факт
    function addFact(what, whom, beats) {
        const key = `${what},${whom}`;
        knowledge.set(key, beats);
        saveKnowledge();
    }
    
    // Нейросетевая логика (принимает решение)
    function neuralDecide(answer, subject) {
        // Ищем в базе
        let known = getFact(answer, subject);
        if (known !== null) return known;
        
        // Если не знаем — запускаем нейросетевой анализ
        // Анализируем семантику слов
        const strongVsWeak = {
            'вода': { strong: ['огонь', 'пламя'], weak: ['камень', 'скала'] },
            'камень': { strong: ['бумага', 'вода'], weak: ['ножницы', 'рука'] },
            'огонь': { strong: ['вода', 'мороз'], weak: ['бумага', 'дерево'] },
            'любовь': { strong: ['ненависть', 'злость'], weak: ['деньги', 'власть'] },
            'знания': { strong: ['невежество', 'глупость'], weak: ['сила', 'деньги'] },
            'время': { strong: ['камень', 'память'], weak: ['терпение', 'надежда'] }
        };
        
        // Проверяем семантику
        if (strongVsWeak[answer] && strongVsWeak[answer].strong.includes(subject)) {
            return true;
        }
        if (strongVsWeak[answer] && strongVsWeak[answer].weak.includes(subject)) {
            return false;
        }
        
        // Умная эвристика: проверяем противоположности
        const opposites = {
            'добро': 'зло', 'зло': 'добро',
            'свет': 'тьма', 'тьма': 'свет',
            'жизнь': 'смерть', 'смерть': 'жизнь'
        };
        
        if (opposites[answer] === subject) {
            return true; // Добро бьёт зло и т.д.
        }
        
        // Случайное решение с обучением
        return Math.random() > 0.5;
    }
    
    // Объяснение решения
    function getReason(answer, subject, beats) {
        if (beats === true) {
            const reasons = [
                `"${answer}" логично побеждает "${subject}"`,
                `По моим данным, "${answer}" сильнее "${subject}"`,
                `Анализ показывает: да, "${answer}" бьёт "${subject}"`,
                `Семантическая сеть подтверждает: ${answer} > ${subject}`
            ];
            return reasons[Math.floor(Math.random() * reasons.length)];
        } else {
            const reasons = [
                `"${answer}" уступает "${subject}" в силе`,
                `После анализа я решила, что "${answer}" не победит "${subject}"`,
                `В моей базе знаний нет подтверждения, что ${answer} бьёт ${subject}`,
                `Я думаю, "${subject}" выигрывает у "${answer}"`
            ];
            return reasons[Math.floor(Math.random() * reasons.length)];
        }
    }
    
    // ============ ИГРА ============
    let currentSubject = "камень";
    let isLoading = false;
    let learningMode = false;
    let learningWhat = "";
    let learningWhom = "";
    
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');
    const statusDiv = document.getElementById('status');
    
    function addMessage(type, text, reason = null) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        let html = `<div class="bubble">${text}`;
        if (reason) html += `<div class="reason">🧠 ${reason}</div>`;
        html += `</div>`;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
    
    function showTyping() { typing.style.display = 'block'; }
    function hideTyping() { typing.style.display = 'none'; }
    
    async function sendMessage() {
        if (isLoading) return;
        const answer = input.value.trim().toLowerCase();
        if (!answer) return;
        
        // Режим обучения
        if (learningMode) {
            if (answer === 'да') {
                addFact(learningWhat, learningWhom, true);
                addMessage('bot', `✅ Запомнила! "${learningWhat}" БЬЁТ "${learningWhom}"`);
            } else if (answer === 'нет') {
                addFact(learningWhat, learningWhom, false);
                addMessage('bot', `✅ Запомнила! "${learningWhat}" НЕ БЬЁТ "${learningWhom}"`);
            } else {
                addMessage('bot', 'Напишите "да" или "нет"');
                return;
            }
            learningMode = false;
            learningWhat = "";
            learningWhom = "";
            addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`);
            isLoading = false;
            input.value = '';
            return;
        }
        
        addMessage('user', answer);
        input.value = '';
        isLoading = true;
        sendBtn.disabled = true;
        showTyping();
        statusDiv.textContent = '🧠 Нейросеть анализирует...';
        
        // Имитация задержки (как настоящая нейросеть)
        setTimeout(() => {
            const beats = neuralDecide(answer, currentSubject);
            const reason = getReason(answer, currentSubject, beats);
            hideTyping();
            
            if (beats) {
                addMessage('bot', `✅ ДА! ${answer} БЬЁТ ${currentSubject}`, reason);
                currentSubject = answer;
                setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 800);
            } else {
                addMessage('bot', `❌ НЕТ, ${answer} НЕ БЬЁТ ${currentSubject}`, reason);
                setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 800);
            }
            
            statusDiv.textContent = `🧠 Нейросеть знает ${knowledge.size} фактов`;
            isLoading = false;
            sendBtn.disabled = false;
            input.focus();
        }, 600);
    }
    
    function resetGame() {
        if (isLoading) return;
        currentSubject = "камень";
        while (chat.children.length > 1) {
            chat.removeChild(chat.lastChild);
        }
        addMessage('bot', '🔄 Игра перезапущена!');
        setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
        statusDiv.textContent = `🧠 Нейросеть знает ${knowledge.size} фактов`;
    }
    
    function learnMode() {
        if (isLoading) return;
        addMessage('bot', '📚 Режим обучения. Напиши правило в формате: "X бьёт Y" (например: "спок бьёт камень")');
        
        // Ожидаем ввод правила
        const originalHandler = window.learnHandler;
        window.learnHandler = (rule) => {
            const parts = rule.toLowerCase().split(' бьёт ');
            if (parts.length === 2) {
                learningWhat = parts[0].trim();
                learningWhom = parts[1].trim();
                if (!learningWhat || !learningWhom) {
                    addMessage('bot', '❌ Неправильный формат. Напиши "X бьёт Y"');
                    return false;
                }
                addMessage('bot', `Правильно ли, что "${learningWhat}" бьёт "${learningWhom}"? (да/нет)`);
                learningMode = true;
                return true;
            } else {
                addMessage('bot', '❌ Напиши в формате "существительное бьёт существительное"');
                return false;
            }
        };
        
        // Перехватываем следующий ввод
        const tempSend = () => {
            const rule = input.value.trim();
            if (rule && window.learnHandler) {
                input.value = '';
                if (window.learnHandler(rule)) {
                    sendBtn.removeEventListener('click', tempSend);
                    input.removeEventListener('keypress', tempKeyPress);
                    window.learnHandler = null;
                }
            }
        };
        const tempKeyPress = (e) => { if (e.key === 'Enter') tempSend(); };
        sendBtn.addEventListener('click', tempSend);
        input.addEventListener('keypress', tempKeyPress);
    }
    
    // Инициализация
    if (!loadKnowledge()) {
        initKnowledge();
    }
    
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('learnBtn').addEventListener('click', learnMode);
    
    statusDiv.textContent = `🧠 Нейросеть знает ${knowledge.size} фактов`;
    input.focus();
</script>
</body>
</html>
