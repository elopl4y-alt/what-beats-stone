<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❓ Что бьёт камень? | Нейросеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #0f3460;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #e94560; margin-bottom: 20px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
        .chat {
            background: #1a1a2e;
            border-radius: 12px;
            height: 400px;
            overflow-y: auto;
            padding: 16px;
            margin-bottom: 16px;
        }
        .message { margin-bottom: 12px; display: flex; }
        .bot { justify-content: flex-start; }
        .user { justify-content: flex-end; }
        .bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 18px;
            background: #e94560;
            color: white;
            word-wrap: break-word;
        }
        .bot .bubble { background: #1a1a2e; border: 1px solid #e94560; }
        .reason { font-size: 11px; opacity: 0.7; margin-top: 5px; }
        .input-area { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: #1a1a2e;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 24px;
            background: #e94560;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #d63a55; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing {
            display: none;
            padding: 10px 16px;
            background: #1a1a2e;
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 12px;
        }
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.4s infinite;
        }
        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
        .controls { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
        .controls button { background: #334155; padding: 8px 16px; font-size: 12px; }
        .status { text-align: center; color: #666; font-size: 11px; margin-top: 12px; }
        .error { color: #e94560; }
    </style>
</head>
<body>
<div class="container">
    <h1>❓ Что бьёт камень?</h1>
    <div class="subtitle">Нейросеть DeepSeek • Бесплатно</div>
    
    <div class="chat" id="chat">
        <div class="message bot">
            <div class="bubble">🔮 Что бьёт "камень"?</div>
        </div>
    </div>
    
    <div class="typing" id="typing"><span>●</span><span>●</span><span>●</span></div>
    
    <div class="input-area">
        <input type="text" id="input" placeholder="Ваш ответ..." autocomplete="off">
        <button id="sendBtn">→</button>
    </div>
    
    <div class="controls">
        <button id="resetBtn">🔄 Новая игра</button>
    </div>
    <div class="status" id="status">🧠 Нейросеть активна | DeepSeek API</div>
</div>

<script>
    // Прокси-сервер для обхода COS (используем cors-anywhere)
    const API_URL = 'https://cors-anywhere.herokuapp.com/https://neural-game-api.onrender.com/api/think';
    
    let currentSubject = "камень";
    let isLoading = false;
    
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');
    const statusDiv = document.getElementById('status');
    
    function addMessage(type, text, reason = null) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        let html = `<div class="bubble">${text}`;
        if (reason) html += `<div class="reason">🧠 ${reason}</div>`;
        html += `</div>`;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
    
    function showTyping() { typing.style.display = 'block'; }
    function hideTyping() { typing.style.display = 'none'; }
    
    async function sendMessage() {
        if (isLoading) return;
        const answer = input.value.trim().toLowerCase();
        if (!answer) return;
        
        addMessage('user', answer);
        input.value = '';
        isLoading = true;
        sendBtn.disabled = true;
        showTyping();
        statusDiv.textContent = '🤔 Нейросеть думает...';
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Origin': window.location.origin
                },
                body: JSON.stringify({ answer, currentSubject })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            hideTyping();
            
            if (data.success) {
                if (data.beats) {
                    addMessage('bot', `✅ ДА! ${answer} БЬЁТ ${currentSubject}`, data.reason);
                    currentSubject = answer;
                    setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
                } else {
                    addMessage('bot', `❌ НЕТ, ${answer} НЕ БЬЁТ ${currentSubject}`, data.reason);
                    setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
                }
                statusDiv.textContent = '🧠 Нейросеть активна | DeepSeek API';
            } else {
                addMessage('bot', `⚠️ ${data.error || 'Ошибка нейросети'}`);
                statusDiv.textContent = '⚠️ Ошибка API';
            }
        } catch (error) {
            hideTyping();
            console.error('Ошибка:', error);
            addMessage('bot', `🌐 Ошибка: ${error.message}. Попробуйте ещё раз.`);
            statusDiv.innerHTML = '🔌 <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank">Нажмите сюда для активации CORS-прокси</a>';
        } finally {
            isLoading = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }
    
    function resetGame() {
        if (isLoading) return;
        currentSubject = "камень";
        while (chat.children.length > 1) {
            chat.removeChild(chat.lastChild);
        }
        addMessage('bot', '🔄 Игра перезапущена!');
        setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
    }
    
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    input.focus();
</script>
</body>
</html>
