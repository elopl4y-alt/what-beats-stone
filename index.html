<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❓ Что бьёт камень? | Нейросеть DeepSeek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
            padding: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            color: white;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 10px;
            color: white;
        }

        .chat-area {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message { justify-content: flex-start; }
        .user-message { justify-content: flex-end; }

        .bubble {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .bot-message .bubble {
            background: #334155;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .user-message .bubble {
            background: #0d9488;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .reason {
            font-size: 0.75rem;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
        }

        .input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: #334155;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            background: #0d9488;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #0f766e;
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing {
            display: none;
            padding: 10px 18px;
            background: #334155;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 16px;
            margin-left: 20px;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            margin: 0 2px;
            animation: blink 1.4s infinite;
        }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        .controls {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .controls button {
            background: #475569;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .controls button:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Что бьёт камень?</h1>
            <p>Настоящая нейросеть DeepSeek | Работает через бэкенд</p>
            <div class="badge">🤖 DeepSeek V3 • Бесплатно • 5M токенов</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                <div class="bubble">
                    Привет! Я нейросеть DeepSeek.<br><br>
                    🔮 <strong>Что бьёт "камень"?</strong>
                </div>
            </div>
        </div>

        <div class="typing" id="typing">
            <span>●</span><span>●</span><span>●</span>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Введите ваш ответ..." autocomplete="off">
            <button id="sendBtn">Отправить →</button>
        </div>

        <div class="controls">
            <button id="resetBtn">🔄 Новая игра</button>
            <button id="statsBtn">📊 Статистика</button>
        </div>
    </div>

    <script>
        // ⚠️ ВАЖНО: ЗАМЕНИТЕ ЭТУ ССЫЛКУ НА ВАШ РЕАЛЬНЫЙ RENDER URL
        const API_URL = 'https://my-neural-game.onrender.com/api/think';
        
        let currentSubject = "камень";
        let isLoading = false;

        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typing');

        function addMessage(type, content, reason = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type === 'bot' ? 'bot-message' : 'user-message'}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (type === 'bot' && reason) {
                bubble.innerHTML = `<div>${content}</div><div class="reason">💭 ${reason}</div>`;
            } else {
                bubble.textContent = content;
            }
            
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        async function sendMessage() {
            if (isLoading) return;
            
            const answer = userInput.value.trim().toLowerCase();
            if (!answer) return;

            addMessage('user', answer);
            userInput.value = '';
            
            isLoading = true;
            sendBtn.disabled = true;
            showTyping();

            try {
                console.log('Отправка запроса к:', API_URL);
                console.log('Данные:', { answer, currentSubject });
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ answer, currentSubject })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Ответ сервера:', data);
                
                hideTyping();

                if (data.success) {
                    if (data.beats) {
                        addMessage('bot', `✅ ДА! ${answer} БЬЁТ ${currentSubject}`, data.reason);
                        currentSubject = answer;
                        setTimeout(() => {
                            addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`);
                        }, 500);
                    } else {
                        addMessage('bot', `❌ НЕТ, ${answer} НЕ БЬЁТ ${currentSubject}`, data.reason);
                        setTimeout(() => {
                            addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`);
                        }, 500);
                    }
                } else {
                    addMessage('bot', `⚠️ Ошибка нейросети: ${data.error || 'попробуйте ещё'}`);
                }
            } catch (error) {
                hideTyping();
                console.error('Ошибка:', error);
                addMessage('bot', `🌐 Ошибка соединения с нейросетью: ${error.message}\n\nПроверьте, запущен ли бэкенд на Render`);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function resetGame() {
            if (isLoading) return;
            currentSubject = "камень";
            // Очищаем чат, оставляя только первое сообщение
            while (chatArea.children.length > 1) {
                chatArea.removeChild(chatArea.lastChild);
            }
            addMessage('bot', '🔄 Игра перезапущена!');
            setTimeout(() => addMessage('bot', `🔮 Что бьёт "${currentSubject}"?`), 500);
        }

        async function showStats() {
            try {
                // Пробуем получить статистику с бэкенда
                const statsUrl = API_URL.replace('/think', '/stats');
                const response = await fetch(statsUrl);
                if (response.ok) {
                    const stats = await response.json();
                    addMessage('bot', `📊 Нейросеть:\n• Модель: ${stats.neuralNetwork || 'DeepSeek'}\n• Статус: ${stats.status || 'active'}\n• Тариф: Бесплатно (5M токенов)`);
                } else {
                    addMessage('bot', '📊 Нейросеть DeepSeek активна через бэкенд на Render');
                }
            } catch (error) {
                addMessage('bot', '📊 Нейросеть DeepSeek активна. Бэкенд работает.');
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        });
        
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('statsBtn').addEventListener('click', showStats);

        // Фокус на поле ввода
        userInput.focus();
        
        // Проверка связи с бэкендом при загрузке
        async function checkBackend() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answer: 'тест', currentSubject: 'тест' })
                });
                if (response.ok) {
                    console.log('✅ Бэкенд доступен');
                } else {
                    console.warn('⚠️ Бэкенд ответил с ошибкой');
                }
            } catch (error) {
                console.warn('⚠️ Бэкенд недоступен:', error.message);
                addMessage('bot', '⚠️ Бэкенд нейросети ещё не запущен. Зайдите на Render и проверьте деплой.');
            }
        }
        
        setTimeout(checkBackend, 1000);
    </script>
</body>
</html>
